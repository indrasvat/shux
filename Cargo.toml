[workspace]
resolver = "2"
members = [
    "crates/shux",
    "crates/shux-core",
    "crates/shux-pty",
    "crates/shux-vt",
    "crates/shux-rpc",
    "crates/shux-plugin",
    "crates/shux-ui",
    "crates/shux-raster",
]
# lens T-tier seeded-bug demo app is a standalone crate (its own Cargo.toml
# carries an empty [workspace]); excluded so the shux workspace never builds it.
exclude = [".shux/fixtures/lens/t/demo-app"]

[workspace.package]
version = "0.47.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/indrasvat/shux"
authors = ["indrasvat"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Terminal
crossterm = "0.29"

# VT parsing
# default-features = false is load-bearing, not cosmetic: vte only enforces its
# OSC buffer cap when built without `std` (the `is_full()` guards are
# `#[cfg(not(feature = "std"))]`). Under `std` the buffer is an unbounded Vec and
# an unterminated OSC retains every byte streamed at it — see issue #102.
vte = { version = "0.15", default-features = false, features = ["ansi"] }


# State
arc-swap = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }


# Error handling
thiserror = "2"
anyhow = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Testing
tempfile = "3"


# Daemonization
nix = { version = "0.31", features = ["process", "signal", "fs", "user", "term"] }

# Filesystem watching (for config hot reload)
notify = "8"

# Timestamps for the plugin audit log
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Params hash for the plugin audit log
sha2 = "0.11"

# ── Build profiles ────────────────────────────────────────────────────────
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# 0, not 1: CI always compiles cold (rust-cache prunes workspace crates), so the
# optimiser costs more than it buys back — measured -63s/job. See #157.
[profile.test]
opt-level = 0
