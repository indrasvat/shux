# A fixture script that sleeps and then signals: a head start in disguise.
# Hold-open loops (`while :; do sleep 3600; done`) and shell condition polls
# (`while [ ! -e f ]; do sleep 0.05; done`) are not matched.
id: sleep-then-act
language: rust
rule:
  kind: string_literal
  regex: 'sleep +[0-9.]+ *(;|&&|\\n) *(echo|printf|exit|touch|kill|: |cat|true|\{)'
