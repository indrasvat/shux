id: test-timed-wait
language: rust
severity: error
message: "a timed wait in a test is a sleep in disguise; wait for a condition with shux_testkit"
note: "docs/testing.md#which-wait-to-use"
files:
  - "crates/*/tests/**/*.rs"
  - "crates/shux/src/rpc/test_harness.rs"
  - "crates/shux/src/rpc/surface_tests.rs"
  - "crates/shux/src/rpc/wire_1.rs"
  - "crates/shux/src/cli/test_support.rs"
  - "crates/shux/src/pane_record_fuzz.rs"
rule:
  matches: timed-wait
---
id: test-timed-wait-unit
language: rust
severity: error
message: "a timed wait in a test is a sleep in disguise; wait for a condition with shux_testkit"
note: "docs/testing.md#which-wait-to-use"
files:
  - "crates/*/src/**/*.rs"
ignores:
  - "crates/shux-testkit/**"
rule:
  all:
    - matches: timed-wait
    - matches: in-cfg-test
