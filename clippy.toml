# clippy.toml — Clippy configuration for shux
#
# NO `msrv` key here on purpose. Clippy reads `rust-version` from Cargo.toml
# (workspace: 1.93). A duplicate `msrv` here overrides it and drifts: it read
# 1.85 while the workspace required 1.93, so clippy suppressed every lint gated
# above 1.85 and warned about the mismatch on every run.
# One source of truth — bump `rust-version` in Cargo.toml.

# A test waits for a condition, never for an amount of time (docs/testing.md).
# Tests poll through `shux-testkit`; production code that genuinely sleeps
# (backoff, pacing, a grace period) says why with
# `#[expect(clippy::disallowed_methods, reason = "...")]` on the statement.
disallowed-methods = [
    { path = "std::thread::sleep", reason = "wait for a condition with shux_testkit, not for time (docs/testing.md)" },
    { path = "tokio::time::sleep", reason = "wait for a condition with shux_testkit, not for time (docs/testing.md)" },
    { path = "tokio::time::sleep_until", reason = "wait for a condition with shux_testkit, not for time (docs/testing.md)" },
    { path = "std::thread::sleep_ms", reason = "wait for a condition with shux_testkit, not for time (docs/testing.md)" },
    { path = "nix::unistd::sleep", reason = "wait for a condition with shux_testkit, not for time (docs/testing.md)" },
    { path = "nix::time::clock_nanosleep", reason = "wait for a condition with shux_testkit, not for time (docs/testing.md)" },
    { path = "libc::sleep", reason = "wait for a condition with shux_testkit, not for time (docs/testing.md)" },
    { path = "libc::usleep", reason = "wait for a condition with shux_testkit, not for time (docs/testing.md)" },
    { path = "libc::nanosleep", reason = "wait for a condition with shux_testkit, not for time (docs/testing.md)" },
]
