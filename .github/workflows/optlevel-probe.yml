name: opt-level probe

# Temporary evidence harness for `[profile.test] opt-level = 0`. Not a gate;
# deleted before merge. #157 measured this change red 4/5 reps because it starved
# shux-plugin's handshake deadline (#160, fixed in #161) — this re-runs it against
# the fix. `opt1` overrides back to main's value, so both arms share a commit.
#
# Colour off and failures dumped inline: three earlier probes produced unusable
# data by grepping their own coloured output and swallowing the failure.

on:
  push:
    branches: [perf/optlevel-probe]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -Dwarnings

jobs:
  probe:
    name: ${{ matrix.os }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        variant: [opt0, opt1]
    steps:
      - uses: actions/checkout@v4

      - name: Install isolated rustup (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export CARGO_HOME="$RUNNER_TEMP/cargo"
          export RUSTUP_HOME="$RUNNER_TEMP/rustup"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
            -fsSL https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest

      - name: Runner facts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "cores=$(sysctl -n hw.logicalcpu)"
          else
            echo "cores=$(nproc)"
          fi
          echo "cpu-budget=$(bash scripts/cpu-budget.sh 2>/dev/null || echo '?')"
          rustc --version
          grep -A2 '^\[profile.test\]' Cargo.toml | tail -2

      - name: Prime dependency graph (untimed, identical across variants)
        shell: bash
        run: cargo nextest run --workspace --no-run

      # Reproduce the state every real CI job starts in: deps warm from
      # rust-cache, workspace crates pruned by it.
      - name: Drop workspace crate artifacts
        shell: bash
        run: |
          cargo clean -p shux -p shux-core -p shux-pty -p shux-vt \
                      -p shux-rpc -p shux-plugin -p shux-ui -p shux-raster

      - name: Timed compile
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          [ "$VARIANT" = opt1 ] && export CARGO_PROFILE_TEST_OPT_LEVEL=1
          start=$(date +%s)
          cargo nextest run --workspace --no-run
          echo "PROBE compile $VARIANT $(( $(date +%s) - start ))s"

      # Five reps of the real target. A cell is green only if all five pass.
      - name: Timed run x5
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          [ "$VARIANT" = opt1 ] && export CARGO_PROFILE_TEST_OPT_LEVEL=1
          fails=0
          for rep in 1 2 3 4 5; do
            start=$(date +%s)
            if make test >"rep-$rep.log" 2>&1; then ok=PASS; else ok=FAIL; fails=$((fails + 1)); fi
            secs=$(( $(date +%s) - start ))
            echo "PROBE run $VARIANT rep$rep ${secs}s $ok"
            grep -E 'Summary \[' "rep-$rep.log" | tail -1 | sed 's/^/    /' || true
            # Anything nextest itself flagged as abnormal.
            grep -cE '^\s+(SLOW|TERMINATING|TRY [0-9]+ FAIL)' "rep-$rep.log" \
              | sed 's/^/    abnormal-markers: /' || true
            # The codegen-sensitive timing test 093 had to rebuild.
            grep -E 'region_scroll_cost_is_linear_in_pane_height' "rep-$rep.log" \
              | tail -1 | sed 's/^/    /' || true
            if [ "$ok" = FAIL ]; then
              echo "    ---- failure detail (tail) ----"
              tail -80 "rep-$rep.log" | sed 's/^/    /' || true
            fi
          done

          echo "=== slowest 10 tests, final rep ==="
          grep -oE 'PASS \[ *[0-9.]+s\] *\([0-9]+/[0-9]+\) [^ ]+ [^ ]+' rep-5.log 2>/dev/null \
            | sed -E 's/PASS \[ *([0-9.]+)s\] *\([0-9]+\/[0-9]+\) /\1 /' \
            | sort -rn | head -10 | sed 's/^/    /' || true

          echo "=== test count (must match across variants) ==="
          grep -oE '[0-9]+ tests run' rep-5.log | tail -1 | sed 's/^/    /' || true

          echo "PROBE failedreps $VARIANT $fails"
          [ "$fails" -eq 0 ]
