version: 2
updates:
  # Actions are pinned to commit SHAs (make check-action-pins); this keeps the
  # pins and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned to its stable/beta branch, which has no version Dependabot can
      # track; its tags need a `toolchain` input these steps do not pass.
      - dependency-name: dtolnay/rust-toolchain
