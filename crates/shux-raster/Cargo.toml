[package]
name = "shux-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Crate code is MIT (workspace). The bundled font asset
# `assets/JetBrainsMonoNerdFontMono-Regular.ttf` is the upstream Nerd Fonts
# patched build of JetBrains Mono, licensed under the SIL Open Font License
# 1.1 (see `assets/OFL.txt`). Downstream packagers should treat the binary
# distribution as a derived work under both licenses.
license = "MIT AND OFL-1.1"
description = "Pure-Rust cell-grid rasterizer — turns a shux-vt Grid<Cell> into a PNG without a terminal emulator."

[dependencies]
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
shux-vt = { path = "../shux-vt" }
thiserror = { workspace = true }
tracing = { workspace = true }

# The gate's pixel/exact tiers used to live here and made serde + sha2 library
# dependencies of the rasterizer (#151 moved them to `crates/shux`). What is left
# needs neither: the crate turns a `Grid<Cell>` into a PNG and serializes nothing.
# The example harnesses still emit JSON reports, which is what dev-dependencies are for.
[dev-dependencies]
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
