[package]
name = "shux-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shux-core = { path = "../shux-core" }
shux-rpc = { path = "../shux-rpc" }
shux-pty = { path = "../shux-pty" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
notify = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

# Process-group signalling. A plugin is a process TREE, and `Child::kill`
# only ever reaches its root — see `kill_plugin_tree` in src/lib.rs.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
shux-testkit = { path = "../shux-testkit" }
# `test-util`: the handshake-budget tests drive tokio's paused clock.
tokio = { workspace = true, features = ["test-util"] }
