<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>shux · shared session</title>
<link rel="icon" href="/_/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/_/viewer.css">
<script type="module" src="/_/viewer.js"></script>
</head>
<body>
<header id="bar" role="status">
  <span class="mark">◉</span>
  <span class="ro">Read-only</span>
  <span class="sep" hidden>·</span>
  <span id="session"></span>
  <span id="expiry"></span>
  <span id="watching"></span>
  <span id="state">loading…</span>
  <button id="zoom" type="button" hidden>Zoom</button>
</header>
<main id="stage">
  <section id="gate" hidden>
    <div id="gate-about">
      <h1>A live terminal session is being shared with you</h1>
      <p>You'll watch it as it happens. You can't type into it.</p>
      <p id="gate-when" hidden></p>
      <p>The person sharing it can see how many people are watching.</p>
    </div>
    <p id="gate-text" hidden></p>
    <button id="watch" type="button">Watch session</button>
    <p class="made">Shared with shux · <a href="https://shux.pages.dev" rel="noreferrer noopener" target="_blank">shux.pages.dev</a></p>
  </section>
  <div id="sizer"><div id="frame"><div id="term"></div></div></div>
</main>
<div id="toast" role="status" hidden>View only: your keys aren't sent.</div>
</body>
</html>
