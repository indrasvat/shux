[package]
name = "shux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A modern, batteries-included terminal multiplexer"
default-run = "shux"

[[bin]]
name = "shux"
path = "src/main.rs"

[dependencies]
shux-core = { path = "../shux-core" }
shux-pty = { path = "../shux-pty" }
shux-vt = { path = "../shux-vt" }
shux-program-status = { path = "../shux-program-status" }
shux-rpc = { path = "../shux-rpc" }
shux-plugin = { path = "../shux-plugin" }
shux-ui = { path = "../shux-ui" }
shux-raster = { path = "../shux-raster" }
crossterm.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
nix.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
unicode-width = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
bytes = "1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
arc-swap = { workspace = true }
sha2 = { workspace = true }
# Already in-tree transitively via nix; direct use is the macOS
# proc_pidinfo(PROC_PIDTBSDINFO) start-time read for the lens scratch
# registry (LENS-R-044 "start time matches") — nix has no wrapper for it.
libc = "0.2"
# Per-scenario sandbox dirs for the lens gate runner (task 081 D4 deny-by-default env).
tempfile.workspace = true
# `shux share` (#297). Routes and the WebSocket upgrade; hyper serves each
# connection itself, so the gateway caps connections, bounds header reads and
# drops a socket by dropping its task.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
# `client`: the one GET that proves a new tunnel reaches this gateway before
# a link is issued. A single request on one connection, so no redirect is
# ever followed.
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
# That GET is HTTPS to the tunnel's public origin, trusting the OS's roots.
# ring, not aws-lc-rs: no cmake at build time. ring still compiles C for its
# target, so it cannot be cross-built for macOS from Linux.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
# `shux share --qr`: the link as a QR code in the terminal. No image support.
qrcode = { version = "0.14", default-features = false }
# The link and viewer secrets: 256 bits from the OS. Already in-tree.
getrandom = "0.4"
# Constant-time comparison of a presented secret's digest.
subtle = "2.6"

[dev-dependencies]
flate2 = "1"
shux-testkit = { path = "../shux-testkit" }
tempfile.workspace = true
base64 = "0.22"
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"
# A WebSocket client for the share gateway's tests; axum's own transport.
tokio-tungstenite = "0.29"

[lints]
workspace = true
